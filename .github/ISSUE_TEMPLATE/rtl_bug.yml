name: UCIe RTL / DV Bug Report
description: Report an RTL bug, testbench bug, or specification ambiguity in the UCIe PHY.
title: "[Bug]: "
body:
  - type: dropdown
    id: module
    attributes:
      label: Module / Sub-block
      description: Which UCIe PHY module or sub-block is affected?
      options:
        - SBTX
        - SBRX
        - LTSM
        - Credits
        - Adapter
        - Other
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Classification of the issue
      options:
        - rtl-bug
        - tb-bug
        - spec-ambiguity
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Impact on verification progress or RTL correctness
      options:
        - blocker
        - major
        - minor
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concise description of the issue and affected signals or transactions.
      placeholder: Describe the observed failure or discrepancy...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior (Spec/Thesis)
      description: What should happen according to the UCIe specification or thesis/design doc? Include section or table references if applicable.
      placeholder: Per UCIe spec section...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened in simulation or RTL? Include UVM_ERROR messages or SVA failures.
      placeholder: Observed UVM_ERROR / assertion failure / incorrect signal value...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide test name, seed, commit hash, and failing packets or hex dumps.
      value: |
        - **Test name:** 
        - **Seed:** 
        - **Commit hash:** 
        - **Failing Packets / Hex dumps:**
          ```text
          
          ```
    validations:
      required: true

  - type: textarea
    id: waveform
    attributes:
      label: Waveform Screenshot
      description: Paste or drag-and-drop waveform screenshots highlighting the relevant cycles and signals.
      placeholder: Drag and drop screenshot(s) here...
    validations:
      required: false
